# Run the CPU tests on every push and pull request. The end-to-end tests drive gatedtrain's own test harness (not in
# the wheel), so gatedtrain's source is checked out at the release this package is tested with. No GPU, Docker, keeper
# or models.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gatedtrain/gatedtrain
          ref: v0.5.0
          path: _deps/gatedtrain
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . "gatedtrain==0.5.0"
      - run: python -m unittest discover -s tests -t tests -v
        env:
          GATEDTRAIN_SRC: ${{ github.workspace }}/_deps/gatedtrain
